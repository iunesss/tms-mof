<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الدورة المؤرشفة</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: {
      navy: '#18212B', gold: '#C9A227', darkGold: '#9E7E1B', lightGold: '#FCF7E8'
    } } } } };
  </script>
</head>

<body class="min-h-screen bg-slate-50 pt-16 text-slate-800">
  <header class="fixed inset-x-0 top-0 z-50 bg-brand-navy text-white shadow-lg">
    <div class="mx-auto flex h-16 max-w-[92%] items-center justify-between px-4">
      <a href="./archive.html" class="flex items-center gap-2">
        <img src="/favicon.png" class="h-9 w-9 rounded-lg bg-white p-1" alt="الشعار" />
        <div>
          <p class="text-xs font-bold">نظام إدارة الدورات</p>
          <p class="text-[10px] text-slate-400">تفاصيل دورة مؤرشفة</p>
        </div>
      </a>
      <a href="./archive.html" class="rounded-lg border border-slate-600 px-3 py-1.5 text-[11px]">العودة للأرشيف</a>
    </div>
  </header>

  <main class="mx-auto max-w-[92%] space-y-5 px-4 py-6">
    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <div class="flex gap-2">
            <span id="courseTypeBadge" class="rounded-lg bg-blue-50 px-2 py-1 text-[11px] font-bold text-blue-700">جارٍ التحميل</span>
            <span id="courseStatusBadge" class="rounded-lg bg-slate-100 px-2 py-1 text-[11px] font-bold text-slate-600">—</span>
          </div>
          <h1 id="courseTitle" class="mt-4 text-xl font-bold">جارٍ تحميل التفاصيل...</h1>
          <p id="courseNumber" class="mt-1 text-xs text-slate-500">—</p>
        </div>
        <span class="rounded-lg bg-brand-lightGold px-3 py-2 text-[11px] font-bold text-brand-darkGold">عرض تاريخي فقط</span>
      </div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="border-b pb-3 text-sm font-bold">معلومات الدورة</h2>
      <dl class="mt-5 grid gap-5 text-xs sm:grid-cols-2 xl:grid-cols-3">
        <div><dt class="text-slate-400">الجهة التدريبية</dt><dd id="providerName" class="mt-1 font-bold">—</dd></div>
        <div><dt class="text-slate-400">المكان</dt><dd id="courseLocation" class="mt-1 font-bold">—</dd></div>
        <div><dt class="text-slate-400">الفترة</dt><dd id="courseDates" class="mt-1 font-bold">—</dd></div>
        <div><dt class="text-slate-400">المقاعد</dt><dd id="totalSeats" class="mt-1 font-bold">—</dd></div>
        <div><dt class="text-slate-400">عدد المرشحين</dt><dd id="candidatesCount" class="mt-1 font-bold">—</dd></div>
      </dl>
      <p id="courseDescription" class="mt-5 border-t pt-4 text-xs leading-6 text-slate-500">—</p>
    </section>

    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="border-b px-5 py-4"><h2 class="text-sm font-bold">المشاركون والمرشحون</h2></div>
      <div id="courseCandidatesGrid" class="grid gap-4 p-5 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="border-b pb-3 text-sm font-bold">المرفقات</h2>
      <div id="courseAttachmentsList" class="mt-4 text-xs text-slate-500">جارٍ التحميل...</div>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
      <h2 class="border-b pb-3 text-sm font-bold">استمارات المرشحين المطلوبة</h2>
      <div id="courseFormsList" class="mt-4 text-xs text-slate-500">جارٍ التحميل...</div>
    </section>
  </main>

  <script type="module" src="./course-info.js"></script>
</body>
</html>
