<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل الدورات | مدير القسم</title>
  <link rel="icon" type="image/png" href="/icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#18212B',
              gold: '#C9A227',
              darkGold: '#9E7E1B',
              lightGold: '#FCF7E8',
            },
          },
        },
      },
    };
  </script>

  <style>
    ::-webkit-scrollbar { display: none; }
    html { scrollbar-width: none; }
  </style>
</head>

<body class="min-h-screen bg-slate-50 pt-16 text-slate-800">
    
  <header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-brand-navy text-white shadow-lg">
  <div class="mx-auto flex h-16 max-w-[92%] items-center justify-between px-4 sm:px-6">

    <a href="./main-courses.html" class="flex items-center gap-2.5">
      <div class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-lg bg-white shadow-md">
        <img
          src="/favicon.png"
          alt="شعار النظام"
          class="h-full w-full object-contain p-1"
        />
      </div>

      <div class="hidden sm:block">
        <h1 class="text-xs font-bold">نظام إدارة الدورات</h1>
        <p class="mt-0.5 text-[10px] text-slate-400">
          سجل الدورات السابقة
        </p>
      </div>
    </a>

    <a
      href="./main-courses.html"
      class="rounded-lg border border-slate-600 px-3 py-1.5 text-[11px] font-semibold text-slate-200 transition hover:border-brand-gold hover:text-brand-gold"
    >
      العودة إلى الدورات
    </a>
  </div>
</header>

  <main class="mx-auto max-w-[92%] space-y-5 px-4 py-6 sm:px-6">

    <section class="rounded-xl border border-slate-200 bg-white px-5 py-4 shadow-sm">
      <p class="text-[11px] text-slate-500">القسم فقط</p>
      <h2 class="mt-0.5 text-lg font-bold text-slate-900">سجل الدورات السابقة</h2>
      <p class="mt-1 text-xs text-slate-500">
        عرض الدورات المكتملة والمؤرشفة التي شارك فيها موظفو القسم.
      </p>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <label for="archiveSearch" class="mb-2 block text-xs font-semibold text-slate-700">البحث في السجل</label>
      <input id="archiveSearch" type="search" placeholder="ابحث باسم الدورة أو رقمها" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-xs outline-none focus:border-brand-gold" />
    </section>

    <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <div class="border-b border-slate-200 px-5 py-4">
        <h3 class="text-sm font-bold text-slate-900">السجل</h3>
        <p id="archiveCountText" class="mt-1 text-xs text-slate-500">جارٍ تحميل السجل...</p>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full min-w-[850px] text-right text-xs">
          <thead class="border-b border-slate-200 bg-slate-50 text-slate-500">
            <tr>
              <th class="px-5 py-3 font-medium">رقم الدورة</th>
              <th class="px-5 py-3 font-medium">العنوان</th>
              <th class="px-5 py-3 font-medium">النوع</th>
              <th class="px-5 py-3 font-medium">الفترة</th>
              <th class="px-5 py-3 font-medium">الحالة</th>
              <th class="px-5 py-3 font-medium"></th>
            </tr>
          </thead>

          <tbody id="archiveTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="6" class="px-5 py-10 text-center text-xs text-slate-400">
                جارٍ تحميل السجل...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>

  <script type="module" src="./archive.js"></script>
</body>
</html>
