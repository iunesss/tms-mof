<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />

  <title>الإشعارات | مدير القسم</title>
  <link rel="icon" type="image/png" href="/icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#18212B',
              gold: '#C9A227',
              darkGold: '#9E7E1B',
              lightGold: '#FCF7E8',
            },
          },
        },
      },
    };
  </script>

  <style>
    ::-webkit-scrollbar {
      display: none;
    }

    html {
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 pt-28 text-slate-800 lg:pt-16">

  <nav class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-brand-navy text-white shadow-lg">
    <div class="mx-auto flex h-16 max-w-[92%] items-center justify-between gap-5 px-4 sm:px-6">

      <a href="./dashboard.html" class="flex shrink-0 items-center gap-2.5">
        <div class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-lg bg-white shadow-md">
          <img
            src="/favicon.png"
            alt="شعار نظام إدارة الدورات"
            class="h-full w-full object-contain p-1"
          />
        </div>

        <div class="hidden sm:block">
          <h1 class="text-xs font-bold">نظام إدارة الدورات</h1>
          <p class="mt-0.5 text-[10px] text-slate-400">بوابة مدير القسم</p>
        </div>
      </a>

      <div class="hidden items-center gap-1 lg:flex">
        <a
          href="./dashboard.html"
          class="rounded-lg px-3 py-1.5 text-xs text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          لوحة التحكم
        </a>

        <a
          href="./manage-courses/main-courses.html"
          class="rounded-lg px-3 py-1.5 text-xs text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          📚 إدارة الدورات
        </a>

        <a
          href="./notifications.html"
          class="relative rounded-lg border border-brand-gold/40 bg-brand-gold/15 px-3 py-1.5 text-xs font-semibold text-brand-gold"
        >
          🔔 الإشعارات

          <span
            id="notificationsBadge"
            class="absolute -left-1 -top-1 hidden min-w-4 rounded-full bg-rose-500 px-1 text-center text-[9px] font-bold leading-4 text-white"
          >
            0
          </span>
        </a>

        <a
          href="./profile.html"
          class="rounded-lg px-3 py-1.5 text-xs text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          👤 الملف الشخصي
        </a>
      </div>

      <div class="flex shrink-0 items-center gap-2.5">
        <div class="hidden rounded-lg bg-white/5 px-2.5 py-1.5 sm:block">
          <p id="currentUserName" class="text-[11px] font-semibold">
            مدير القسم
          </p>

          <p class="mt-0.5 text-[10px] text-slate-400">
            مدير قسم
          </p>
        </div>

        <span class="hidden h-2 w-2 rounded-full bg-emerald-400 sm:block"></span>

        <button
          id="logoutButton"
          type="button"
          class="rounded-lg border border-red-400/30 px-2.5 py-1.5 text-[11px] font-semibold text-red-300 transition hover:bg-red-500/10"
        >
          تسجيل الخروج
        </button>
      </div>
    </div>

    <div class="border-t border-white/10 px-4 py-2 lg:hidden">
      <div class="flex gap-2 overflow-x-auto whitespace-nowrap">
        <a
          href="./dashboard.html"
          class="rounded-lg bg-white/10 px-2.5 py-1.5 text-[11px]"
        >
          لوحة التحكم
        </a>

        <a
          href="./manage-courses/main-courses.html"
          class="rounded-lg bg-white/10 px-2.5 py-1.5 text-[11px]"
        >
          الدورات
        </a>

        <a
          href="./notifications.html"
          class="rounded-lg bg-brand-gold px-2.5 py-1.5 text-[11px] font-bold text-brand-navy"
        >
          الإشعارات
        </a>

        <a
          href="./profile.html"
          class="rounded-lg bg-white/10 px-2.5 py-1.5 text-[11px]"
        >
          ملفي
        </a>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-[92%] space-y-5 px-4 py-6 sm:px-6">

    <section class="flex flex-col gap-4 rounded-xl border border-slate-200 bg-white px-5 py-4 shadow-sm lg:flex-row lg:items-center lg:justify-between">
      <div>
        <p class="text-[11px] text-slate-500">تنبيهات القسم والدورات</p>

        <h2 class="mt-0.5 text-lg font-bold text-slate-900">
          الإشعارات
        </h2>

        <p id="unreadNotificationsLabel" class="mt-1 text-xs text-slate-500">
          جارٍ تحميل الإشعارات...
        </p>
      </div>

      <button
        id="markAllNotificationsReadButton"
        type="button"
        class="w-fit rounded-lg border border-brand-gold px-4 py-2.5 text-xs font-bold text-brand-darkGold transition hover:bg-brand-lightGold"
      >
        تحديد الكل كمقروء
      </button>
    </section>

    <section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">

        <select
          id="notificationCategoryFilter"
          class="rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-xs outline-none focus:border-brand-gold"
        >
          <option value="">كل أنواع الإشعارات</option>
          <option value="NOMINATIONS">الترشيحات</option>
          <option value="COURSES">الدورات والمهام</option>
          <option value="DOCUMENTS">المستندات والنماذج</option>
          <option value="GENERAL">إشعارات عامة</option>
        </select>

        <select
          id="notificationReadFilter"
          class="rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-xs outline-none focus:border-brand-gold"
        >
          <option value="">كل الحالات</option>
          <option value="UNREAD">غير مقروءة</option>
          <option value="READ">مقروءة</option>
        </select>

        <input
          id="notificationSearchInput"
          type="search"
          placeholder="ابحث داخل الإشعارات"
          class="rounded-lg border border-slate-300 px-3.5 py-2.5 text-xs outline-none focus:border-brand-gold xl:col-span-2"
        />

        <div class="xl:col-span-4">
          <button
            id="clearNotificationFiltersButton"
            type="button"
            class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-50"
          >
            إعادة ضبط الفلاتر
          </button>
        </div>
      </div>
    </section>

    <section>
      <div class="mb-3 flex items-center justify-between">
        <p id="notificationsPageInfo" class="text-xs text-slate-500">
          جارٍ تحميل الإشعارات...
        </p>
      </div>

      <div id="notificationsList" class="space-y-3">
        <div class="rounded-xl border border-dashed border-slate-300 bg-white px-5 py-12 text-center text-xs text-slate-400">
          جارٍ تحميل الإشعارات...
        </div>
      </div>

      <div class="mt-5 flex items-center justify-between">
        <button
          id="previousNotificationsPageButton"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-[11px] font-bold text-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          السابق
        </button>

        <p id="notificationsPaginationText" class="text-xs text-slate-500">
          —
        </p>

        <button
          id="nextNotificationsPageButton"
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-[11px] font-bold text-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          التالي
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="./notifications.js"></script>
</body>
</html>
